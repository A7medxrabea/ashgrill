<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AshGrill Admin - Orders</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background: #fffaf3;
      color: #222;
    }
    h1 {
      color: #e67e22;
    }
    input, button {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #e67e22;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #cf711f;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    th {
      background: #f7f7f7;
    }
    tr:hover {
      background: #fff2e0;
    }
  </style>
</head>
<body>
  <h1>🥩 AshGrill Admin - All Orders</h1>

  <div>
    <input type="password" id="adminKey" placeholder="Enter Admin Key" />
    <button onclick="loadOrders()">View Orders</button>
  </div>

  <table id="ordersTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Quantity</th>
        <th>Total</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadOrders() {
      const key = document.getElementById("adminKey").value.trim();
      if (!key) return alert("⚠️ Enter admin key first.");

      try {
        const res = await fetch(`http://localhost:5000/api/admin/orders?key=${key}`);
        if (!res.ok) {
          alert("❌ Unauthorized or error loading orders.");
          return;
        }

        const orders = await res.json();
        const tbody = document.querySelector("#ordersTable tbody");
        tbody.innerHTML = "";

        orders.forEach(o => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${new Date(o.date).toLocaleString()}</td>
            <td>${o.name}</td>
            <td>${o.phone}</td>
            <td>${o.address}</td>
            <td>${o.quantity}</td>
            <td>${o.total || o.quantity * 1500}</td>
            <td>${o.notes || ""}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        alert("⚠️ Failed to load orders. Check server.");
      }
    }
  </script>
</body>
</html>
